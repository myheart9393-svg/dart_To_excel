[project]
name = "dart-excel"
version = "0.1.0"
description = "DART 보고서(재무제표·주석)를 시트별로 나눈 Excel로 변환하는 Streamlit 앱"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "streamlit>=1.35",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# 선택적 fallback. 기본 경로에서는 사용하지 않는다.
browser = ["playwright>=1.44"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dart"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: 실제 DART 네트워크 호출 (기본 실행에서 제외, --run-network 로 실행)"]
